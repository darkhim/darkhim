<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-label="OakNet Termlink — access granted, welcome Andrea Guglielmo">
  <defs>
    <radialGradient id="crt" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0f2a14"/>
      <stop offset="70%" stop-color="#07160a"/>
      <stop offset="100%" stop-color="#020703"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.28"/>
    </pattern>
    <filter id="glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3cff6e" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3cff6e" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#3cff6e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    text{font-family:'VT323','Share Tech Mono','Fira Mono','Courier New',monospace;fill:#3cff6e;font-size:22px;letter-spacing:1px}
    .dim{fill:#1f9c41}
    .big{font-size:29px;font-weight:bold}
    .screen{animation:flicker 4s infinite steps(1)}
    @keyframes flicker{0%{opacity:1}47%{opacity:.93}48%{opacity:1}82%{opacity:.96}83%{opacity:1}}
    .t{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation-fill-mode:forwards;animation-name:type}
    @keyframes type{to{transform:scaleX(1)}}
    .t1{animation:type .9s steps(36) .3s forwards}
    .t2{animation:type .8s steps(34) 1.3s forwards}
    .t3{animation:type .6s steps(16) 2.4s forwards}
    .t4{animation:type .7s steps(26) 3.3s forwards}
    .t5{animation:type 1.1s steps(40) 4.4s forwards}
    .t6{animation:type .9s steps(44) 5.7s forwards}
    .pr{opacity:0;animation:show 0s 6.6s forwards}
    @keyframes show{to{opacity:1}}
    .cur{opacity:0;animation:blink 1s 6.6s infinite steps(1)}
    @keyframes blink{0%{opacity:1}50%{opacity:0}}
    .sw{animation:sweep 6s linear infinite}
    @keyframes sweep{from{transform:translateY(-120px)}to{transform:translateY(340px)}}
  </style>

  <rect width="960" height="320" rx="18" fill="url(#crt)"/>

  <g class="screen" filter="url(#glow)">
    <clipPath id="c1"><rect class="t t1" x="40" y="22" width="880" height="30"/></clipPath>
    <clipPath id="c2"><rect class="t t2" x="40" y="54" width="880" height="30"/></clipPath>
    <clipPath id="c3"><rect class="t t3" x="40" y="104" width="880" height="30"/></clipPath>
    <clipPath id="c4"><rect class="t t4" x="40" y="136" width="880" height="30"/></clipPath>
    <clipPath id="c5"><rect class="t t5" x="40" y="186" width="880" height="44"/></clipPath>
    <clipPath id="c6"><rect class="t t6" x="40" y="234" width="880" height="30"/></clipPath>

    <text x="480" y="44" text-anchor="middle" clip-path="url(#c1)">OAKNET INDUSTRIES (TM) TERMLINK PROTOCOL</text>
    <text x="480" y="76" text-anchor="middle" class="dim" clip-path="url(#c2)">COPYRIGHT 2015-2077 OAKNET S.R.L. — ALL RIGHTS RESERVED</text>

    <text x="48" y="126" clip-path="url(#c3)">&gt; LOGON DARKHIM</text>
    <text x="48" y="158" clip-path="url(#c4)">&gt; ENTER PASSWORD: ************</text>

    <text x="48" y="216" class="big" clip-path="url(#c5)">ACCESS GRANTED. WELCOME, ANDREA GUGLIELMO</text>
    <text x="48" y="250" class="dim" clip-path="url(#c6)">NETWORK · CLOUD · CYBERSECURITY  //  FOUNDER @ OAKNET</text>
    <text x="48" y="290" class="pr">&gt;</text>
    <rect class="cur" x="70" y="272" width="13" height="22" fill="#3cff6e"/>
  </g>

  <rect class="sw" x="0" y="0" width="960" height="90" fill="url(#sweep)"/>
  <rect width="960" height="320" rx="18" fill="url(#scan)"/>
  <rect x="3" y="3" width="954" height="314" rx="16" fill="none" stroke="#1f9c41" stroke-opacity=".55" stroke-width="2"/>
</svg>
